# Render.com uchun tayyor sozlama.
# Repozitoriyani Render'ga ulaganda shu fayl avtomatik o'qiladi.
#
# MUHIM: DATABASE_URL ga Render'ning "Internal Database URL" manzilini qo'ying
# (dpg-xxxxxxxx-a/albayan ko'rinishida, nuqtasiz). U tezroq, bepul va SSL talab
# qilmaydi. "External Database URL" faqat tashqaridan ulanish uchun kerak
# (kompyuterdan tekshirish, ma'lumot ko'chirish, sinov).
services:
  - type: web
    name: albayan-cairo-erp
    runtime: node
    plan: starter          # doimiy disk uchun eng kam tarif
    buildCommand: npm install && node build.js
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: AlBayan Cairo
      - key: DATA_DIR
        value: /var/data
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: BACKUP_KEEP
        value: "30"
      - key: DATABASE_URL
        sync: false        # Render "Internal Database URL"; bo'sh bo'lsa diskdagi fayl bazasi
      - key: PG_POOL_MAX
        value: "4"
      - key: PG_IDLE_MS
        value: "15000"
      - key: PG_CONNECT_MS
        value: "15000"
      - key: SESSION_MAX_AGE_DAYS
        value: "7"
      - key: SEED_DIRECTOR_LOGIN
        value: admin
      - key: SEED_DIRECTOR_PASSWORD
        sync: false        # bo'sh qoldirilsa birinchi parol: 1234 (kirgandan keyin almashtiring)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
    disk:
      name: albayan-data
      mountPath: /var/data
      sizeGB: 1
